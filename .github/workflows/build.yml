name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # Telegram API credentials
      # ============================================================

      - name: Configure Telegram API credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          path = "build-system/appstore-configuration.json"

          api_id = os.environ.get("TG_API_ID", "").strip()
          api_hash = os.environ.get("TG_API_HASH", "").strip()

          if not api_id:
              raise SystemExit("TG_API_ID secret is missing")

          if not api_hash:
              raise SystemExit("TG_API_HASH secret is missing")

          with open(path, "r", encoding="utf-8") as f:
              config = json.load(f)

          config["api_id"] = api_id
          config["api_hash"] = api_hash

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=4)
              f.write("\n")

          print("Telegram API credentials configured")
          print("API ID length:", len(api_id))
          print("API hash length:", len(api_hash))
          PY

      # ============================================================
      # Disable SiriKit for sideload
      #
      # Вместо:
      #
      # INPreferences.requestSiriAuthorization(...)
      # INPreferences.siriAuthorizationStatus()
      #
      # полностью заставляем Telegram считать Siri недоступной.
      #
      # Это важно для SideStore signing без Siri entitlement.
      # ============================================================

      - name: Disable SiriKit for sideload
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("submodules/TelegramUI/Sources/AppDelegate.swift")

          if not path.exists():
              raise SystemExit(
                  f"ERROR: {path} does not exist"
              )

          text = path.read_text(encoding="utf-8")

          start_marker = (
              "        }, requestSiriAuthorization: { completion in\n"
          )

          end_marker = (
              "        }, getWindowHost: {\n"
          )

          start = text.find(start_marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: requestSiriAuthorization block not found"
              )

          end = text.find(end_marker, start)

          if end == -1:
              raise SystemExit(
                  "ERROR: getWindowHost marker not found"
              )

          old_block = text[start:end]

          # Safety check: убеждаемся, что патчим именно ожидаемый блок.
          if "INPreferences.requestSiriAuthorization" not in old_block:
              raise SystemExit(
                  "ERROR: Siri request API missing from expected block"
              )

          if "INPreferences.siriAuthorizationStatus()" not in old_block:
              raise SystemExit(
                  "ERROR: Siri status API missing from expected block"
              )

          replacement = (
              "        }, requestSiriAuthorization: { completion in\n"
              "            completion(false)\n"
              "        }, siriAuthorization: {\n"
              "            return .denied\n"
          )

          text = text[:start] + replacement + text[end:]

          path.write_text(text, encoding="utf-8")

          # Verify dangerous calls are gone from this block.
          updated = path.read_text(encoding="utf-8")

          new_start = updated.find(start_marker)
          new_end = updated.find(end_marker, new_start)

          new_block = updated[new_start:new_end]

          if "INPreferences.requestSiriAuthorization" in new_block:
              raise SystemExit(
                  "ERROR: requestSiriAuthorization call still present"
              )

          if "INPreferences.siriAuthorizationStatus()" in new_block:
              raise SystemExit(
                  "ERROR: siriAuthorizationStatus call still present"
              )

          print("========================================")
          print("SiriKit sideload patch")
          print("========================================")
          print(f"Patched: {path}")
          print()
          print("requestSiriAuthorization -> completion(false)")
          print("siriAuthorization        -> .denied")
          print()
          print("SiriKit disabled successfully")
          PY

      # ============================================================
      # Xcode
      # ============================================================

      - name: Set active Xcode path
        run: |
          set -euo pipefail

          XCODE_VERSION=$(python3 -c \
            'import json; print(json.load(open("versions.json"))["xcode"])')

          echo "Using Xcode $XCODE_VERSION"

          sudo xcode-select -s \
            "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

          xcodebuild -version

      # ============================================================
      # Restore Bazel cache
      # ============================================================

      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v6
        with:
          path: /Users/Shared/bazel-disk-cache

          key: swiftgram-bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-${{ github.sha }}

          restore-keys: |
            swiftgram-bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-
            swiftgram-bazel-${{ runner.os }}-

      # ============================================================
      # Bazel cache diagnostics
      # ============================================================

      - name: Check Bazel cache
        run: |
          echo "========================================"
          echo "Bazel cache diagnostics"
          echo "========================================"

          echo "Exact cache hit:"
          echo "${{ steps.bazel-cache.outputs.cache-hit }}"

          echo
          echo "Matched cache key:"
          echo "${{ steps.bazel-cache.outputs.cache-matched-key }}"

          echo
          echo "Primary cache key:"
          echo "${{ steps.bazel-cache.outputs.cache-primary-key }}"

          echo

          if [ -d "/Users/Shared/bazel-disk-cache" ]; then
            echo "Cache directory exists"

            echo
            echo "Cache size:"
            du -sh /Users/Shared/bazel-disk-cache || true

            echo
            echo "Cache files:"
            find /Users/Shared/bazel-disk-cache -type f | wc -l
          else
            echo "NO BAZEL CACHE RESTORED"
          fi

          echo "========================================"

      # ============================================================
      # Canonical source directory
      # ============================================================

      - name: Create canonical source directory
        run: |
          set -euo pipefail

          sudo rm -rf /Users/Shared/telegram-ios
          sudo mkdir -p /Users/Shared/telegram-ios

          sudo cp -R \
            "$GITHUB_WORKSPACE/." \
            /Users/Shared/telegram-ios/

          sudo chown -R \
            "$(whoami)" \
            /Users/Shared/telegram-ios

      # ============================================================
      # Build
      # ============================================================

      - name: Build the App
        id: build_app
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          BAZEL_CACHE="/Users/Shared/bazel-disk-cache"

          cd "$SOURCE_DIR"

          mkdir -p "$BAZEL_CACHE"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          APP_VERSION=$(python3 -c \
            'import json; print(json.load(open("versions.json"))["app"])')

          COMMIT_COUNT=$(git rev-list --count HEAD)

          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))

          echo "========================================"
          echo "APP_VERSION=$APP_VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "========================================"

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          # --------------------------------------------------------
          # Fake signing certificates
          # --------------------------------------------------------

          python3 \
            build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          # --------------------------------------------------------
          # Build Swiftgram
          # --------------------------------------------------------

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # --------------------------------------------------------
          # Collect IPA
          # --------------------------------------------------------

          OUTPUT_PATH="build/artifacts"

          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          IPA_SOURCE="bazel-bin/Telegram/Swiftgram.ipa"
          IPA_OUTPUT="$OUTPUT_PATH/Swiftgram.ipa"

          if [ ! -f "$IPA_SOURCE" ]; then
            echo "ERROR: Swiftgram.ipa not found"
            exit 1
          fi

          cp "$IPA_SOURCE" "$IPA_OUTPUT"

          IPA_SIZE=$(stat -f%z "$IPA_OUTPUT")

          echo "IPA_SIZE=$IPA_SIZE" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "Swiftgram successfully built"
          echo "========================================"

          ls -lh "$IPA_OUTPUT"

          echo
          echo "IPA size in bytes:"
          echo "$IPA_SIZE"

          echo
          echo "Bazel cache after build:"
          du -sh "$BAZEL_CACHE" || true

      # ============================================================
      # Upload IPA as GitHub Actions artifact
      # ============================================================

      - name: Upload IPA as artifact
        if: steps.build_app.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: Swiftgram-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Swiftgram.ipa
          if-no-files-found: error
          retention-days: 30
          archive: false

      # ============================================================
      # Save updated Bazel cache
      # ============================================================

      - name: Save Bazel cache
        if: >
          always() &&
          steps.build_app.outcome == 'success' &&
          steps.bazel-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: /Users/Shared/bazel-disk-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      # ============================================================
      # GitHub Release
      # ============================================================

      - name: Create GitHub Release
        if: steps.build_app.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}

          name: Swiftgram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})

          body: |
            Personal Swiftgram sideload build.

            Version: ${{ env.APP_VERSION }}
            Build: ${{ env.BUILD_NUMBER }}

            Telegram API credentials injected from GitHub Secrets.

            Sideload compatibility:
            - CloudKit fallback disabled
            - SiriKit disabled

          files: |
            /Users/Shared/telegram-ios/build/artifacts/Swiftgram.ipa

      # ============================================================
      # Update SideStore source
      #
      # Создаёт/обновляет apps.json в репозитории.
      #
      # IPA берётся напрямую из GitHub Release.
      # ============================================================

      - name: Update SideStore source
        if: steps.build_app.outcome == 'success'
        uses: actions/github-script@v9
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          IPA_SIZE: ${{ env.IPA_SIZE }}
          TARGET_BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const appVersion = process.env.APP_VERSION;
            const buildNumber = process.env.BUILD_NUMBER;
            const ipaSize = Number(process.env.IPA_SIZE);
            const branch = process.env.TARGET_BRANCH;

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const repositoryURL =
              `https://github.com/${owner}/${repo}`;

            const sourceURL =
              `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/apps.json`;

            const downloadURL =
              `${repositoryURL}/releases/download/build-${buildNumber}/Swiftgram.ipa`;

            const iconURL =
              `https://github.com/${owner}.png?size=512`;

            const now = new Date().toISOString();

            const source = {
              name: "Donyka Swiftgram",
              identifier: "io.github.donyka.swiftgram",
              sourceURL: sourceURL,

              apps: [
                {
                  name: "Swiftgram",

                  bundleIdentifier: "ph.telegra.Telegraph",

                  developerName: "Donyka",

                  subtitle:
                    "Personal Swiftgram sideload build",

                  localizedDescription:
                    "Personal Swiftgram build based on Telegram for iOS and Swiftgram.",

                  iconURL: iconURL,

                  tintColor: "2AABEE",

                  category: "social",

                  version: appVersion,

                  buildVersion: buildNumber,

                  versionDate: now,

                  versionDescription:
                    `Swiftgram ${appVersion} build ${buildNumber}`,

                  downloadURL: downloadURL,

                  size: ipaSize,

                  versions: [
                    {
                      version: appVersion,

                      buildVersion: buildNumber,

                      date: now,

                      localizedDescription:
                        `Swiftgram ${appVersion} build ${buildNumber}`,

                      downloadURL: downloadURL,

                      size: ipaSize
                    }
                  ]
                }
              ]
            };

            const json =
              JSON.stringify(source, null, 2) + "\n";

            const content =
              Buffer
                .from(json)
                .toString("base64");

            let existingSha;

            try {
              const existing =
                await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: "apps.json",
                  ref: branch
                });

              if (!Array.isArray(existing.data)) {
                existingSha = existing.data.sha;
              }

              console.log(
                "Existing apps.json found"
              );
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              console.log(
                "apps.json does not exist yet; creating it"
              );
            }

            const args = {
              owner,
              repo,
              path: "apps.json",

              message:
                `Update SideStore source to ${appVersion} (${buildNumber})`,

              content,
              branch
            };

            if (existingSha) {
              args.sha = existingSha;
            }

            await github.rest.repos.createOrUpdateFileContents(args);

            console.log("========================================");
            console.log("SideStore source updated");
            console.log("========================================");
            console.log(`Version: ${appVersion}`);
            console.log(`Build: ${buildNumber}`);
            console.log(`IPA size: ${ipaSize}`);
            console.log(`Download: ${downloadURL}`);
            console.log(`Source: ${sourceURL}`);
