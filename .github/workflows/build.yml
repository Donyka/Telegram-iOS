name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # Telegram API credentials
      #
      # Берём из:
      # Settings -> Secrets and variables -> Actions
      #
      # TG_API_ID
      # TG_API_HASH
      # ============================================================

      - name: Configure Telegram API credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          path = "build-system/appstore-configuration.json"

          api_id = os.environ.get("TG_API_ID", "").strip()
          api_hash = os.environ.get("TG_API_HASH", "").strip()

          if not api_id:
              raise SystemExit("TG_API_ID secret is missing")

          if not api_hash:
              raise SystemExit("TG_API_HASH secret is missing")

          with open(path, "r", encoding="utf-8") as f:
              config = json.load(f)

          config["api_id"] = api_id
          config["api_hash"] = api_hash

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=4)
              f.write("\n")

          print("Telegram API credentials configured successfully")
          print("api_id length:", len(api_id))
          print("api_hash length:", len(api_hash))
          PY

      # ============================================================
      # Xcode
      # ============================================================

      - name: Set active Xcode path
        run: |
          set -euo pipefail

          XCODE_VERSION=$(python3 -c \
            'import json; print(json.load(open("versions.json"))["xcode"])')

          echo "Using Xcode: $XCODE_VERSION"

          sudo xcode-select -s \
            "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

          xcodebuild -version

      # ============================================================
      # Restore Bazel disk cache
      #
      # Точный SHA -> отдельный snapshot.
      # Для нового commit restore-keys подхватит предыдущий cache.
      # ============================================================

      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v6
        with:
          path: /Users/Shared/bazel-disk-cache
          key: swiftgram-bazel-macos26-${{ hashFiles('versions.json') }}-${{ github.sha }}
          restore-keys: |
            swiftgram-bazel-macos26-${{ hashFiles('versions.json') }}-
            swiftgram-bazel-macos26-

      # ============================================================
      # Canonical source directory
      # ============================================================

      - name: Create canonical source directory
        run: |
          set -euo pipefail

          sudo rm -rf /Users/Shared/telegram-ios
          sudo mkdir -p /Users/Shared/telegram-ios

          sudo cp -R "$GITHUB_WORKSPACE/." \
            /Users/Shared/telegram-ios/

          sudo chown -R "$(whoami)" \
            /Users/Shared/telegram-ios

      # ============================================================
      # Build
      # ============================================================

      - name: Build the App
        id: build_app
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          BAZEL_CACHE="/Users/Shared/bazel-disk-cache"

          cd "$SOURCE_DIR"

          mkdir -p "$BAZEL_CACHE"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          APP_VERSION=$(python3 -c \
            'import json; print(json.load(open("versions.json"))["app"])')

          COMMIT_COUNT=$(git rev-list --count HEAD)

          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))

          echo "APP_VERSION=$APP_VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER"

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          # Fake signing certificates.
          # SideStore потом переподпишет IPA твоим Apple ID.
          python3 \
            build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          # Build Swiftgram.
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # ========================================================
          # Collect IPA
          # ========================================================

          OUTPUT_PATH="build/artifacts"

          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          cp \
            bazel-bin/Telegram/Swiftgram.ipa \
            "$OUTPUT_PATH/Swiftgram.ipa"

          echo
          echo "========================================"
          echo "Swiftgram build completed successfully"
          echo "========================================"

          ls -lh "$OUTPUT_PATH/Swiftgram.ipa"

      # ============================================================
      # СНАЧАЛА сохраняем IPA.
      #
      # Поэтому даже если cache/release потом сломается,
      # собранный файл уже будет в GitHub Actions.
      # ============================================================

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v7
        with:
          path: /Users/Shared/telegram-ios/build/artifacts/Swiftgram.ipa
          if-no-files-found: error
          retention-days: 30

          # Для одного IPA не создаём ещё один zip поверх него.
          archive: false

      # ============================================================
      # Save Bazel cache
      #
      # Если cache-сервис упадёт или cache окажется слишком большим,
      # сам workflow из-за этого не запорется.
      # ============================================================

      - name: Save Bazel cache
        if: always() && steps.build_app.outcome == 'success' && steps.bazel-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: /Users/Shared/bazel-disk-cache
          key: swiftgram-bazel-macos26-${{ hashFiles('versions.json') }}-${{ github.sha }}

      # ============================================================
      # GitHub Release
      # ============================================================

      - name: Create GitHub Release
        if: steps.build_app.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Swiftgram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})

          body: |
            Personal Swiftgram build.

            Version: ${{ env.APP_VERSION }}
            Build: ${{ env.BUILD_NUMBER }}

            Built with custom Telegram API credentials.

          files: |
            /Users/Shared/telegram-ios/build/artifacts/Swiftgram.ipa
