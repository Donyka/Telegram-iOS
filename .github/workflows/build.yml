name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set active Xcode path
        run: |
          set -e

          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')

          echo "Using Xcode $XCODE_VERSION"

          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

          xcodebuild -version

      # ============================================================
      # Bazel cache
      # ============================================================

      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: /Users/Shared/bazel-disk-cache

          # Каждый commit получает свой cache snapshot.
          # При новом commit GitHub возьмёт последний подходящий cache ниже.
          key: swiftgram-bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-${{ github.sha }}

          restore-keys: |
            swiftgram-bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-
            swiftgram-bazel-${{ runner.os }}-

      # ============================================================
      # Canonical Telegram source path
      # ============================================================

      - name: Create canonical source directory
        run: |
          set -ex

          sudo rm -rf /Users/Shared/telegram-ios
          sudo mkdir -p /Users/Shared/telegram-ios

          sudo cp -R "$GITHUB_WORKSPACE/." /Users/Shared/telegram-ios/

          sudo chown -R "$(whoami)" /Users/Shared/telegram-ios

      # ============================================================
      # Build
      # ============================================================

      - name: Build the App
        run: |
          set -ex

          SOURCE_DIR="/Users/Shared/telegram-ios"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          BAZEL_CACHE="/Users/Shared/bazel-disk-cache"

          cd "$SOURCE_DIR"

          mkdir -p "$BAZEL_CACHE"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')

          COMMIT_COUNT=$(git rev-list --count HEAD)

          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))

          echo "APP_VERSION=$APP_VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER"

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          # Fake certificates for unsigned/sideload build
          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          # Build Swiftgram
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # ========================================================
          # Collect IPA
          # ========================================================

          OUTPUT_PATH="build/artifacts"

          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          cp \
            bazel-bin/Telegram/Swiftgram.ipa \
            "$OUTPUT_PATH/Swiftgram.ipa"

          echo
          echo "=============================="
          echo "Swiftgram build completed"
          echo "=============================="

          ls -lh "$OUTPUT_PATH/Swiftgram.ipa"

      # ============================================================
      # Save cache BEFORE release/upload stuff
      #
      # Поэтому если GitHub Release потом сломается,
      # успешная компиляция всё равно попадёт в cache.
      # ============================================================

      - name: Save Bazel cache
        if: steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Users/Shared/bazel-disk-cache
          key: swiftgram-bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-${{ github.sha }}

      # ============================================================
      # GitHub Actions Artifact
      #
      # Самое важное: IPA сохраняется здесь ещё до Release.
      # ============================================================

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-IPA-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Swiftgram.ipa
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # GitHub Release
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Swiftgram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})

          body: |
            Personal unsigned Swiftgram build.

            Version: ${{ env.APP_VERSION }}
            Build: ${{ env.BUILD_NUMBER }}

            Install the IPA using SideStore.

          files: |
            /Users/Shared/telegram-ios/build/artifacts/Swiftgram.ipa
